name: "GSSoC Score Calculator"

on:
  pull_request_target:
    types: [closed]

jobs:
  calculate-score:
    if: github.event.pull_request.merged == true
    name: Calculate and Post PR Score
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: Calculate Score
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            
            // Only calculate if gssoc:approved is present
            if (!labels.includes('gssoc:approved')) {
              console.log("PR not marked as gssoc:approved. Skipping score calculation.");
              return;
            }
            
            let difficultyPoints = 0;
            let levelFound = 'None';
            
            // 1. Difficulty Points
            if (labels.includes('level:critical')) { difficultyPoints = 80; levelFound = 'Critical'; }
            else if (labels.includes('level:advanced')) { difficultyPoints = 55; levelFound = 'Advanced'; }
            else if (labels.includes('level:intermediate')) { difficultyPoints = 35; levelFound = 'Intermediate'; }
            else if (labels.includes('level:beginner')) { difficultyPoints = 20; levelFound = 'Beginner'; }
            
            let typePoints = 0;
            let typeFound = 'Other';
            
            // 2. Contribution Type Points
            if (labels.includes('type:security')) { typePoints = 20; typeFound = 'Security'; }
            else if (labels.includes('type:devops')) { typePoints = 15; typeFound = 'DevOps'; }
            else if (labels.includes('type:performance')) { typePoints = 15; typeFound = 'Performance'; }
            else if (labels.includes('type:bug')) { typePoints = 10; typeFound = 'Bug'; }
            else if (labels.includes('type:feature')) { typePoints = 10; typeFound = 'Feature'; }
            else if (labels.includes('type:testing')) { typePoints = 10; typeFound = 'Testing'; }
            else if (labels.includes('type:refactor')) { typePoints = 10; typeFound = 'Refactor'; }
            else if (labels.includes('type:design')) { typePoints = 10; typeFound = 'Design'; }
            else if (labels.includes('type:docs')) { typePoints = 5; typeFound = 'Docs'; }
            else { typePoints = 15; } // Default for 'other'
            
            let basePoints = difficultyPoints + typePoints;
            
            // 3. Quality Multiplier
            let qualityMultiplier = 1.0;
            let qualityLevel = 'Clean';
            
            if (labels.includes('quality:exceptional')) {
              qualityMultiplier = 1.5;
              qualityLevel = 'Exceptional';
            } else if (labels.includes('quality:clean')) {
              qualityMultiplier = 1.0;
              qualityLevel = 'Clean';
            }
            
            let totalPoints = Math.round(basePoints * qualityMultiplier);
            
            const contributor = pr.user.login;
            
            const message = `
            🎉 **Congratulations @${contributor}! Your PR has been merged!** 🎉
            
            Thank you for your contribution to **ConsentFlow** for GSSoC '26! Here is your official score breakdown for this PR:
            
            ### 📊 Score Breakdown
            | Category | Category Label | Points |
            |----------|----------------|--------|
            | **Difficulty** | \`${levelFound}\` | ${difficultyPoints} |
            | **Type** | \`${typeFound}\` | ${typePoints} |
            | **Base Score** | | **${basePoints}** |
            | **Quality Multiplier** | \`${qualityLevel}\` | **x${qualityMultiplier}** |
            
            ### 🏆 Total Points Awarded: **${totalPoints}**
            
            Keep up the fantastic work! 🚀
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });
